name: Daily tech news

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/fetch-tech-news.mjs
      - name: Commit updated news
        run: |
          git config user.name "daily-tech-news-bot"
          git config user.email "daily-tech-news-bot@users.noreply.github.com"
          git add app/data/latest-tech-news.json app/data/latest-tech-news.ts app/data/archive app/data/archive-index.ts
          git diff --cached --quiet || git commit -m "Update daily tech news"
          git push
